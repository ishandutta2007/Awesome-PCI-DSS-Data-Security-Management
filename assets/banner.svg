<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .pulse-slow {
        animation: pulse 4s ease-in-out infinite;
      }
      .dash-flow {
        stroke-dasharray: 8, 8;
        animation: flow 16s linear infinite;
      }
      .node-float1 {
        animation: float1 5s ease-in-out infinite alternate;
      }
      .node-float2 {
        animation: float2 6s ease-in-out infinite alternate;
      }
      @keyframes flow {
        to { stroke-dashoffset: -160; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.04); }
      }
      @keyframes float1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(8px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="12"/>

  <!-- Ambient Animated Glowing Orbs (Deep Background) -->
  <circle cx="150" cy="80" r="140" fill="url(#glowGrad)" class="pulse-slow" style="transform-origin: 150px 80px;"/>
  <circle cx="1050" cy="280" r="160" fill="url(#glowGrad)" class="pulse-slow" style="transform-origin: 1050px 280px; animation-delay: 2s;"/>

  <!-- Subtle Network / Grid Architecture in Background -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- Animated Data Security Stream / Connecting Circuit Lines (Background Layer) -->
  <g opacity="0.35">
    <path d="M 80,180 C 250,80 400,260 600,180 C 800,100 950,280 1120,180" fill="none" stroke="#38bdf8" stroke-width="2" class="dash-flow"/>
    <path d="M 80,240 C 300,320 450,120 650,240 C 850,340 980,130 1120,240" fill="none" stroke="#a855f7" stroke-width="1.5" class="dash-flow" style="animation-direction: reverse; animation-duration: 20s;"/>
  </g>

  <!-- Background Decorative Badge Floats (Right Side - Never overlapping center text) -->
  <g class="node-float1" opacity="0.85">
    <rect x="940" y="60" width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="962" cy="81" r="5" fill="#38bdf8"/>
    <text x="976" y="86" fill="#e2e8f0" font-size="13" font-weight="600">🛡️ PCI DSS v4.0.1</text>
  </g>

  <g class="node-float2" opacity="0.85">
    <rect x="910" y="140" width="220" height="42" rx="21" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2"/>
    <circle cx="932" cy="161" r="5" fill="#818cf8"/>
    <text x="946" y="166" fill="#e2e8f0" font-size="13" font-weight="600">🔐 Cardholder Data (CDE)</text>
  </g>

  <g class="node-float1" opacity="0.85" style="animation-delay: 1.5s;">
    <rect x="950" y="220" width="170" height="42" rx="21" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2"/>
    <circle cx="972" cy="241" r="5" fill="#c084fc"/>
    <text x="986" y="246" fill="#e2e8f0" font-size="13" font-weight="600">⚡ Zero-Trust &amp; DSPM</text>
  </g>

  <!-- Central Foreground Shield / Security Emblem -->
  <g transform="translate(80, 85)">
    <!-- Outer Shield Glow -->
    <path d="M 50 10 Q 90 10 90 50 C 90 95 50 120 50 120 C 50 120 10 95 10 50 Q 10 10 50 10 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="3" filter="url(#glow)"/>
    <path d="M 50 10 Q 90 10 90 50 C 90 95 50 120 50 120 C 50 120 10 95 10 50 Q 10 10 50 10 Z" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="2.5"/>
    <!-- Lock Glyph inside Shield -->
    <rect x="36" y="58" width="28" height="22" rx="4" fill="url(#primaryGrad)"/>
    <path d="M 42 58 V 46 A 8 8 0 0 1 58 46 V 58" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="50" cy="68" r="2.5" fill="#0f172a"/>
    <line x1="50" y1="70.5" x2="50" y2="75" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Main Foreground Headers (Strictly on Foreground, Maximum Readability) -->
  <g transform="translate(210, 0)">
    <!-- Pill Tag -->
    <g transform="translate(0, 75)">
      <rect width="250" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="12" y="17" fill="#38bdf8" font-size="11.5" font-weight="700" letter-spacing="1">CURATED AUDIT &amp; COMPLIANCE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" fill="url(#primaryGrad)" font-size="38" font-weight="900" letter-spacing="-0.5">Awesome PCI-DSS &amp; Data Security</text>

    <!-- Subtitle -->
    <text x="0" y="188" fill="#e2e8f0" font-size="17" font-weight="500">Enterprise Cloud Security Posture, Cardholder Data Protection &amp; Continuous Compliance</text>

    <!-- Key Metrics / Feature Highlights Pills -->
    <g transform="translate(0, 222)">
      <rect x="0" y="0" width="130" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" fill="#94a3b8" font-size="12" font-weight="600">💳 PCI DSS v4.0</text>

      <rect x="142" y="0" width="135" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="156" y="20" fill="#94a3b8" font-size="12" font-weight="600">☁️ CSPM &amp; CNAPP</text>

      <rect x="289" y="0" width="125" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="303" y="20" fill="#94a3b8" font-size="12" font-weight="600">🔍 Open Source</text>

      <rect x="426" y="0" width="130" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="440" y="20" fill="#94a3b8" font-size="12" font-weight="600">📊 Audit Evidence</text>
    </g>
  </g>

  <!-- Bottom Accent Stripe with Gradient -->
  <rect x="0" y="354" width="1200" height="6" fill="url(#primaryGrad)"/>
</svg>
